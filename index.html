<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izometryczny Stolik Graczy</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 { margin-bottom: 10px; }

        .controls {
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        select {
            padding: 5px 10px;
            font-size: 16px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }

        /* Scena 3D / Izometria */
        .table-container {
            position: relative;
            width: 600px;
            height: 600px;
            perspective: 1000px;
            border: 2px dashed #444;
            border-radius: 12px;
            background: radial-gradient(circle, #252525 0%, #111 80%);
            overflow: hidden;
        }

        .table-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #777;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Karta gracza */
        .player-slot {
            position: absolute;
            /* Płynne przejścia pozycji i skali */
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: bottom center;
            cursor: pointer;
            z-index: 1;
        }

        .card {
            width: 90px;
            height: 130px;
            background: linear-gradient(135deg, #4a6fa5, #2c3e50);
            border: 2px solid #7697cb;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            box-sizing: border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-title {
            font-size: 11px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            width: 100%;
            text-align: center;
            padding: 2px 0;
            border-radius: 3px;
        }

        .card-body {
            font-size: 10px;
            text-align: center;
            color: #dcdcdc;
        }

        /* Efekt hover - Zoom karty z zachowaniem izometrii */
        .player-slot:hover {
            z-index: 100; /* Dajemy kartę na sam wierzch */
        }

        .player-slot:hover .card {
            transform: scale(1.6) translateY(-20px);
            box-shadow: 0 15px 30px rgba(0, 200, 255, 0.4);
            border-color: #00d2ff;
        }
    </style>
</head>
<body>

    <h2>Wybór Układu Graczy</h2>
    <div class="controls">
        <label for="playerCount">Liczba graczy (4-8): </label>
        <select id="playerCount" onchange="updateTable()">
            <option value="4">4 Graczy (Kwadrat)</option>
            <option value="5">5 Graczy (Pentagon)</option>
            <option value="6">6 Graczy (Heksagon)</option>
            <option value="7">7 Graczy (Heptagon)</option>
            <option value="8" selected>8 Graczy (Oktagon)</option>
        </select>
    </div>

    <div class="table-container" id="tableContainer">
        <div class="table-center">Stół</div>
    </div>

    <script>
        function updateTable() {
            const container = document.getElementById('tableContainer');
            // Usuń stare karty, zostawiając środek stołu
            const oldSlots = container.querySelectorAll('.player-slot');
            oldSlots.forEach(slot => slot.remove());

            const count = parseInt(document.getElementById('playerCount').value);
            const radius = 180; // Promień rozstawienia graczy od środka
            const centerX = 300; // Środek kontenera X (600/2)
            const centerY = 300; // Środek kontenera Y (600/2)

            for (let i = 0; i < count; i++) {
                // Obliczanie kąta dla każdego gracza (rozmieszczenie kołowe)
                // -Math.PI / 2 sprawia, że pierwszy gracz jest na samym dole (najbliżej ekranu)
                const angle = (i * 2 * Math.PI / count) - (Math.PI / 2);

                // Pozycja X i Y na okręgu
                const x = centerX + radius * Math.cos(angle) - 45; // -45 to połowa szerokości karty
                const y = centerY + radius * Math.sin(angle) - 65; // -65 to połowa wysokości karty

                // Symulacja głębi (izometrii):
                // Gracze na dole (sin(angle) > 0) mają większą skalę bazową, ci u góry mniejszą.
                // Używamy cosinus/sinusa do płynnego skalowania perspektywicznego.
                const depthFactor = 0.75 + 0.25 * ((Math.sin(angle) + 1) / 2);

                // Tworzenie elementu gracza
                const slot = document.createElement('div');
                slot.className = 'player-slot';
                slot.style.left = `${x}px`;
                slot.style.top = `${y}px`;
                slot.style.transform = `scale(${depthFactor})`;

                // Wnętrze karty
                slot.innerHTML = `
                    <div class="card">
                        <div class="card-title">Gracz ${i + 1}</div>
                        <div class="card-body">Karta #${i + 1}</div>
                        <div style="font-size:9px; color:#aaa;">Atak: ${10 + i}</div>
                    </div>
                `;

                container.appendChild(slot);
            }
        }

        // Inicjalizacja przy starcie strony
        window.onload = updateTable;
    </script>
</body>
</html>
